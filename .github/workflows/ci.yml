name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-files:
    name: No private data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so every commit in a pull request can be inspected

      - name: Check the tree for data/, models/, artifacts/ and notebook outputs
        run: python3 scripts/check_private_files.py

      - name: Check every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_private_files.py --base "origin/${BASE_REF}"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      # Tests must never download model weights; fail loudly if one tries.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the test suite
        run: uv run --locked pytest -q
