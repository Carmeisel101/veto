[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veto"
version = "0.1.0"
description = "Privacy-focused identification of political text messages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.5",
]

[project.scripts]
veto-build-corpus = "veto.corpus.builder:main"
veto = "veto.cli:main"
vito = "veto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
